services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huntops
      POSTGRES_PASSWORD: huntops
      POSTGRES_DB: huntops
    ports:
      - "5432:5432"
    volumes:
      - huntops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huntops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://huntops:huntops@db:5432/huntops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  huntops_pg_data:
