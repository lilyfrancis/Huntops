name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-test-secret-not-for-production-use-only"
          ENVIRONMENT: "test"
          ENABLE_SIGNUP: "true"
          PAYSTACK_SECRET_KEY: "sk_test_dummy"
          PAYSTACK_PLAN_PRO: "PLN_test_pro"
          PAYSTACK_PLAN_ELITE: "PLN_test_elite"
        run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `tsc -b && vite build` — the build is the typecheck. Added after a
      # bad import reached a commit because nothing checked the frontend.
      - run: npm run build
